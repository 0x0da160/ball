<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07080b">
<title>B.A.L.L. — 第1段階</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #07080b; color: #d8dde6;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { position: fixed; inset: 0; touch-action: none; }
  #game { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: rgba(5, 6, 9, 0.72); text-align: center; padding: 24px;
  }
  #overlay.show { display: flex; }
  #overlay h1 { margin: 0; font-size: 34px; letter-spacing: 0.12em; color: #ffd36b; }
  #overlay p { margin: 0; font-size: 15px; line-height: 1.6; color: #b9c0cc; }
  #overlay button {
    margin-top: 6px; font-size: 18px; padding: 12px 34px; border-radius: 10px;
    border: 1px solid #ffd36b; background: #1a1610; color: #ffd36b; font-weight: 600;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <h1 id="ov-title">B.A.L.L.</h1>
  <p id="ov-text"></p>
  <button id="ov-btn" type="button">スタート</button>
</div>
<script src="game.js"></script>
</body>
</html>
