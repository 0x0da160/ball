<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050506">
<title>B.A.L.L.</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #050506; color: #d8d2c6;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { position: fixed; inset: 0; touch-action: none; }
  #game { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: radial-gradient(ellipse at 50% 40%, rgba(20,16,12,0.72), rgba(3,3,4,0.9));
    text-align: center; padding: 24px; overflow-y: auto;
  }
  #overlay.show { display: flex; }
  #overlay h1 {
    margin: 0; font-size: 32px; letter-spacing: 0.12em; color: #f0c870;
    text-shadow: 0 2px 0 #3a2a10, 0 0 18px rgba(255,190,80,0.35);
  }
  #overlay p { margin: 0; font-size: 15px; line-height: 1.65; color: #cfc6b6; max-width: 340px; }
  #overlay .eq { display: block; margin: 10px 0; padding: 8px 12px; border: 1px solid #3a342c; border-radius: 8px; background: rgba(0,0,0,0.35); font-size: 13px; color: #b8ae9c; text-align: left; }
  #ov-buttons { display: flex; flex-direction: column; gap: 10px; width: min(300px, 100%); }
  #ov-buttons button {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font: inherit; font-size: 17px; padding: 12px 18px; border-radius: 10px;
    border: 1px solid #b8913e; color: #f3d9a0; font-weight: 600;
    background: linear-gradient(#2a2217, #17120c);
    box-shadow: inset 0 1px 0 rgba(255,220,150,0.15), 0 4px 12px rgba(0,0,0,0.5);
  }
  #ov-buttons button small { font-size: 12px; font-weight: 400; color: #b5a88f; }
  #ov-buttons button.quiet { border-color: #4a443b; color: #b8ae9c; background: rgba(0,0,0,0.3); font-size: 15px; padding: 9px 18px; }
  #ov-buttons button:active { transform: translateY(1px); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <h1 id="ov-title">B.A.L.L.</h1>
  <p id="ov-text"></p>
  <div id="ov-buttons"></div>
</div>
<script src="textures.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
